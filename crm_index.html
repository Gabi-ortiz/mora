<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --side: #101a33; --side-2: #1f2c4d; --side-ink: #c8d1e6; --side-mute: #6c7a99;
    --bg: #f4f6fa; --panel: #fff; --ink: #1c2333; --ink-2: #344054; --muted: #667085; --soft: #98a2b3;
    --line: #eaecf0; --line-2: #d0d5dd; --accent: #2e5bff; --accent-soft: #eef4ff;
    --p1: #d92d20; --p1-bg: #fde8e8; --p1-ink: #b42318;
    --p2: #f79009; --p2-bg: #fff1e0; --p2-ink: #b54708;
    --p3: #caa300; --p3-bg: #fef7d6; --p3-ink: #8a6a00;
    --p4: #98a2b3; --p4-bg: #eef2f6; --p4-ink: #475467;
    --ok: #17b26a; --ok-bg: #e3f6ea; --ok-ink: #067647;
    --wa: #12b76a; --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }

  /* ---------- Estructura ---------- */
  .app { display: flex; min-height: 100vh; }
  aside { width: 232px; flex: none; background: var(--side); color: var(--side-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
  .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 17px; margin: 0 6px 22px; }
  .logo b { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #2e5bff, #7a5af8); display: grid; place-items: center; font-size: 15px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--side-ink); font-weight: 500; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
  .nav:hover { background: rgba(255, 255, 255, .05); }
  .nav.on { background: var(--side-2); color: #fff; }
  .nav .ic { width: 18px; text-align: center; opacity: .9; }
  .nav .n { margin-left: auto; background: var(--p1); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 700; }
  .nav[data-v=objetivos] .n { background: #3e4c6e; }
  .sec { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--side-mute); margin: 16px 12px 4px; }
  .ver { margin-top: auto; font-size: 11px; color: var(--side-mute); padding: 0 12px 8px; }
  .yo { display: flex; gap: 10px; align-items: center; padding: 12px 8px 0; border-top: 1px solid #22304f; }
  .yo .nm { color: #fff; font-weight: 600; line-height: 1.2; }
  .yo .rl { font-size: 12px; }
  .yo button { margin-left: auto; background: none; border: 0; color: var(--side-mute); cursor: pointer; font-size: 12px; }
  .yo button:hover { color: #fff; }
  .main { flex: 1; min-width: 0; padding: 24px 28px 40px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: var(--muted); margin-top: 2px; }
  .search { background: #fff; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 14px; width: 320px; max-width: 100%; }

  /* ---------- Piezas ---------- */
  .avatar { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; }
  .avatar.sm { width: 28px; height: 28px; font-size: 11px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .s-P1 { background: var(--p1-bg); color: var(--p1-ink); } .s-P1 .dot { background: var(--p1); }
  .s-P2 { background: var(--p2-bg); color: var(--p2-ink); } .s-P2 .dot { background: var(--p2); }
  .s-P3 { background: var(--p3-bg); color: var(--p3-ink); } .s-P3 .dot { background: var(--p3); }
  .s-P4 { background: var(--p4-bg); color: var(--p4-ink); } .s-P4 .dot { background: var(--p4); }
  .s-AL_DIA { background: var(--ok-bg); color: var(--ok-ink); } .s-AL_DIA .dot { background: var(--ok); }
  .s-RESCINDIDO, .s-BAJA { background: #f2f4f7; color: #475467; } .s-RESCINDIDO .dot, .s-BAJA .dot { background: #667085; }
  .caso { background: var(--accent-soft); color: #3538cd; }
  .caso.sin { background: #f2f4f7; color: var(--muted); }
  .fiat { font-size: 10px; font-weight: 800; letter-spacing: .03em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; margin-left: 5px; vertical-align: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: #fff; border-radius: 8px; padding: 7px 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: #f9fafb; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.pri:hover { background: #2549d6; }
  .btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }
  input.in, select.in, textarea.in { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
  textarea.in { min-height: 72px; resize: vertical; }
  .in:focus, .search:focus { outline: 2px solid #b2ccff; border-color: var(--accent); }
  .muted { color: var(--muted); }
  .alerta { color: var(--p1-ink); font-weight: 600; }
  .card { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { padding: 16px 18px 0; }
  .card-h h3 { margin: 0; font-size: 15px; }
  .card-h .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .vacio { padding: 36px 16px; text-align: center; color: var(--muted); }

  /* KPIs */
  .saludo { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, #eef4ff, #f4f0ff); border: 1px solid #dfe6ff; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
  .saludo b { font-size: 15px; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { background: #fff; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); border-top: 4px solid var(--line-2); cursor: pointer; transition: transform .08s; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; }
  .kpi:hover { transform: translateY(-1px); }
  .kpi.on { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  .kpi .l { color: #475467; font-size: 13px; font-weight: 600; }
  .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.15; margin-top: 2px; }
  .kpi .h { color: var(--soft); font-size: 12px; }
  .meter { height: 8px; background: #eef2f6; border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  /* Tabla de cartera */
  .bar { display: flex; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .tab { padding: 6px 12px; border-radius: 8px; color: #475467; font-weight: 600; border: 0; background: none; cursor: pointer; }
  .tab.on { background: var(--accent-soft); color: var(--accent); }
  .tab small { background: var(--line); border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: 11px; color: #475467; }
  .bar .der { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .bar select { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; background: #fff; }
  .selbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #101a33; color: #fff; border-radius: var(--radius) var(--radius) 0 0; flex-wrap: wrap; }
  .selbar select { border-radius: 8px; padding: 5px 8px; border: 0; color: var(--ink); background: #fff; }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; text-align: left; color: var(--muted); font-weight: 600; padding: 10px 10px; background: #f9fafb; white-space: nowrap; }
  td { padding: 10px 10px; border-top: 1px solid #f2f4f7; vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 16px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f8faff; }
  .cli { min-width: 170px; max-width: 250px; }
  .cli b { display: block; line-height: 1.25; }
  .cli span { color: var(--soft); font-size: 12px; white-space: nowrap; }
  .mini { display: inline-flex; gap: 2px; }
  .mini i { width: 9px; height: 14px; border-radius: 2px; background: #e4e7ec; display: block; }
  .mini i.P { background: #6ce9a6; } .mini i.I { background: #f97066; } .mini i.R { background: #98a2b3; } .mini i.C { background: #b2ccff; }
  .mini i.M { background: #fff; outline: 2px solid var(--p2); outline-offset: -2px; }
  .mini i.M.P { background: #6ce9a6; outline: 0; }
  .nowrap { white-space: nowrap; }
  .obj { color: #7a5af8; font-weight: 800; }
  .activos { display: flex; gap: 8px; align-items: center; padding: 12px 14px 0; color: var(--muted); flex-wrap: wrap; }
  .leyenda { padding: 12px 16px; background: #f9fafb; border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: 13px; }
  .objs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .ob { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; border-left: 4px solid #7a5af8; }
  .ob h5 { margin: 0 0 2px; font-size: 14px; }
  .ob .meta { font-size: 12px; color: var(--muted); }
  .ob .meter i { background: #7a5af8; }
  .ob .meter.ok i { background: var(--ok); }
  .ob .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .grupo td { background: #f9fafb; font-weight: 700; border-top: 2px solid var(--line); }
  .grupo { cursor: pointer; }
  .grupo.total td { background: #eef4ff; }
  .tmed th { white-space: normal; line-height: 1.25; vertical-align: bottom; }
  .tmed td { text-align: center; } .tmed td:first-child { text-align: left; }
  .asig { display: inline-block; min-width: 30px; padding: 2px 8px; border-radius: 6px; background: #eef4ff; color: var(--accent); }
  .tagobj { display: inline-block; background: #f4f0ff; color: #5925dc; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600; }
  .sub td:first-child { padding-left: 34px; }
  .sub { cursor: pointer; }
  .sub:hover td { background: #f8faff; }
  .ck { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-weight: 600; color: var(--ink-2); font-size: 13px; }
  .mas { padding: 14px; text-align: center; border-top: 1px solid var(--line); }

  /* ---------- Ficha (drawer) ---------- */
  #ficha { position: fixed; inset: 0; background: rgba(16, 26, 51, .45); display: flex; justify-content: flex-end; z-index: 20; }
  .dr { width: min(680px, 100%); background: #fff; height: 100%; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0, 0, 0, .2); animation: entra .18s ease-out; }
  @keyframes entra { from { transform: translateX(30px); opacity: .6; } }
  .dr-h { padding: 18px 24px 14px; background: linear-gradient(180deg, #f5f8ff, #fff); border-bottom: 1px solid var(--line); }
  .dr-h h2 { margin: 0 0 6px; font-size: 21px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dr-nav { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dr-tabs { display: flex; gap: 20px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .dr-tabs button { padding: 12px 0; font-weight: 600; color: var(--muted); border: 0; background: none; cursor: pointer; }
  .dr-tabs button.on { color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
  .dr-b { padding: 18px 24px 30px; overflow-y: auto; flex: 1; }
  h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .cuotas { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; margin: 4px 0 18px; }
  .cu { text-align: center; border-radius: 6px; padding: 5px 0; font-size: 11px; color: var(--muted); background: #f2f4f7; }
  .cu b { display: block; font-size: 13px; color: var(--ink); }
  .cu.P { background: var(--ok-bg); } .cu.I { background: var(--p1-bg); } .cu.I b { color: var(--p1-ink); } .cu.R { background: #e4e7ec; }
  .cu.M { outline: 2px solid var(--p2); outline-offset: -2px; background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; background: #fff; cursor: pointer; color: var(--ink-2); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .f2 .full { grid-column: 1 / -1; }
  .fl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .fl .in { font-weight: 400; color: var(--ink); font-size: 14px; }
  .promesa { border: 1px dashed #b2ccff; background: #f8faff; border-radius: 10px; padding: 10px; }
  .atajos { display: flex; gap: 4px; margin-top: 4px; }
  .acciones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
  .datos div span { display: block; font-size: 11px; color: var(--soft); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .scoring { background: #f8faff; border: 1px solid #dfe6ff; border-radius: 10px; padding: 12px 14px; margin-top: 16px; white-space: pre-wrap; }
  .tl { border-left: 2px solid var(--line); padding-left: 18px; margin-left: 6px; }
  .ev { position: relative; margin-bottom: 16px; }
  .ev:before { content: ""; position: absolute; left: -25px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .ev.ok:before { background: var(--ok); } .ev.no:before { background: var(--p4); } .ev.vieja:before { background: #d0d5dd; }
  .ev .t { font-size: 12px; color: var(--soft); }
  .ev .x { background: #f9fafb; border-radius: 10px; padding: 8px 12px; margin-top: 4px; white-space: pre-wrap; }
  .ev.vieja .x { background: #fff; border: 1px dashed var(--line-2); }

  /* ---------- Tablero ---------- */
  .kp4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kp4 .k { background: #fff; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .kp4 .v { font-size: 26px; font-weight: 700; }
  .g2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-top: 16px; }
  .pad { padding: 14px 18px 18px; }
  .br { display: grid; grid-template-columns: 72px 1fr 120px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .track { height: 18px; background: #f2f4f7; border-radius: 5px; position: relative; overflow: hidden; }
  .track .a { position: absolute; left: 0; top: 0; bottom: 0; background: #f97066; }
  .track .b { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, #fec84b, #fec84b 4px, #fedf89 4px, #fedf89 8px); }
  .lg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .cols { display: flex; align-items: flex-end; gap: 6px; height: 140px; margin-top: 8px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; min-width: 0; }
  .col i { display: block; }
  .col i:first-child { border-radius: 3px 3px 0 0; }
  .col span { font-size: 10px; color: var(--soft); text-align: center; margin-top: 4px; }
  .pr { display: flex; align-items: center; gap: 8px; min-width: 140px; }
  .pr .t { flex: 1; height: 7px; background: #eef2f6; border-radius: 4px; overflow: hidden; }
  .pr .t i { display: block; height: 100%; background: var(--accent); }

  /* ---------- Acceso ---------- */
  .auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .auth .marca { background: radial-gradient(circle at 20% 20%, #2e5bff55, transparent 50%), radial-gradient(circle at 80% 80%, #7a5af855, transparent 50%), var(--side); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
  .auth .marca h2 { font-size: 30px; margin: 0 0 10px; line-height: 1.2; }
  .auth .marca p { color: var(--side-ink); max-width: 420px; }
  .auth .form { display: grid; place-items: center; padding: 32px 16px; }
  .auth form { width: min(380px, 100%); }
  .auth form h3 { margin: 0 0 4px; font-size: 22px; }
  .auth .fl { margin-top: 14px; }
  .auth .btn { width: 100%; margin-top: 18px; padding: 10px; }
  .auth .err { color: var(--p1-ink); margin-top: 12px; min-height: 1.2em; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #101a33; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 40; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
  .cargando { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: gira .7s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* ---------- Celular / pantallas chicas ---------- */
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g2 { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    aside { width: 100%; height: auto; position: sticky; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px; z-index: 10; }
    .logo { margin: 0 8px 0 0; } .logo span, .sec, .yo .nm, .yo .rl, .nav .tx { display: none; }
    #nav { display: flex; gap: 2px; } .ver { display: none; } .nav { width: auto; } .yo { margin: 0 0 0 auto; border: 0; padding: 0 0 0 8px; }
    .saludo { flex-wrap: wrap; } .saludo .btn { margin-left: 0 !important; width: 100%; }
    .main { padding: 16px; } .kpis, .kp4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .auth { grid-template-columns: 1fr; } .auth .marca { padding: 24px; } .datos, .f2 { grid-template-columns: 1fr; }
    .cuotas { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="auth" hidden></div>
<div id="app" class="app" hidden>
  <aside>
    <div class="logo"><b>M</b><span>CRM Mora</span></div>
    <div id="nav"></div>
    <div class="ver" id="ver"></div><div class="yo"><span class="avatar" id="yoAv"></span><div><div class="nm" id="yoNom"></div><div class="rl" id="yoRol"></div></div><button id="salir" title="Salir">Salir</button></div>
  </aside>
  <div class="main">
    <div class="top"><div><h1 id="titulo"></h1><div class="sub" id="subtitulo"></div></div>
      <input class="search" id="buscar" placeholder="Buscar cliente, solicitud o teléfono" autocomplete="off"></div>
    <div id="main"></div>
  </div>
</div>
<div id="ficha" hidden><div class="dr" id="dr"></div></div>
<div id="toast" hidden></div>

<script>
// Tiene que ser igual a CRM_VERSION en crm_mora.gs.
var VERSION = '2026-09-25.1';
var S = {
  token: null, ini: null, planes: [], vista: 'cartera', limite: 200,
  filtro: { texto: '', situacion: '', estado: '', resp: '', avance: '', objetivo: '' }, seleccion: {}, objetivos: [],
  cola: [], fichaTab: 'gestionar', ficha: null,
};
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var COLORES = ['#2e5bff', '#7a5af8', '#12b76a', '#f79009', '#ee46bc', '#06aed4', '#d92d20'];
var ICONO_RES = { 'Atendió': '✅', 'No atendió': '📵', 'Buzón / apagado': '📴', 'Mensaje enviado': '💬', 'Respondió mensaje': '↩️', 'Número erróneo': '⚠️', 'N/A': '—' };
var ICONO_CANAL = { 'Llamada': '📞', 'WhatsApp': '🟢', 'SMS': '✉️', 'Mail': '📧', 'Presencial': '🤝', 'Sin contacto (solo actualización)': '📝' };

// ---------- Utilidades ----------
function $(id) { return document.getElementById(id); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function cada(sel, raiz, fn) { Array.prototype.forEach.call((raiz || document).querySelectorAll(sel), fn); }
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3500);
}
function error(e) { if (!e || !e.sesion) toast('⚠️ ' + (e && e.message ? e.message : e)); }
function pad2(n) { return ('0' + n).slice(-2); }
function hoyStr(dias) { var d = new Date(); d.setDate(d.getDate() + (dias || 0)); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function ddmm(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) : ''; }
function diasDesde(s) {
  if (!s) return null;
  var a = new Date(s.slice(0, 10) + 'T00:00:00'), b = new Date(hoyStr() + 'T00:00:00');
  return Math.round((b - a) / 864e5);
}
function haceCuanto(s) {
  var d = diasDesde(s);
  if (d === null) return '';
  return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días';
}
function plata(v) { var n = Number(v); return isNaN(n) || v === '' ? esc(v) : '$ ' + n.toLocaleString('es-AR'); }
function pct(x) { return (x * 100).toFixed(1).replace('.', ',') + '%'; }
function iniciales(n) {
  var p = String(n || '?').replace(/[^\wÁÉÍÓÚÑáéíóúñ ]/g, ' ').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}
function colorDe(email) {
  var lista = (S.ini && S.ini.responsables) || [];
  var i = lista.map(function (r) { return r.email; }).indexOf(email);
  return COLORES[(i < 0 ? 6 : i) % COLORES.length];
}
function pillSit(s, corto) { return '<span class="pill s-' + s.codigo + '"><i class="dot"></i>' + esc(corto ? s.codigo.replace('AL_DIA', 'Al día').replace('RESCINDIDO', 'Rescindido').replace('BAJA', 'Baja') : s.etiqueta) + '</span>'; }
function pillCaso(e) { return '<span class="pill caso' + (e === 'Sin gestionar' ? ' sin' : '') + '">' + esc(e) + '</span>'; }
function opciones(lista, sel, vacio) {
  return (vacio !== undefined ? '<option value="">' + esc(vacio) + '</option>' : '') +
    lista.map(function (v) { return '<option' + (v === sel ? ' selected' : '') + '>' + esc(v || '—') + '</option>'; }).join('');
}
function miniCuotas(p) {
  var h = '<span class="mini" title="C2 a C14 · recuadro naranja: cuota del mes">';
  for (var i = 0; i < 13; i++) {
    var v = (p.cuotas || [])[i] || '', n = i + 2;
    h += '<i class="' + esc(v) + (n === p.avance ? ' M' : '') + '"></i>';
  }
  return h + '</span>';
}
function esActiva(p) { return p.situacion.codigo !== 'RESCINDIDO' && p.situacion.codigo !== 'BAJA'; }
function esPrio(p) { return p.situacion.codigo === 'P1' || p.situacion.codigo === 'P2'; }

// ---------- Servidor ----------
function apiLibre(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, mal) {
    var run = google.script.run.withSuccessHandler(ok).withFailureHandler(mal);
    // Si falta la función, crm_mora.gs publicado es más viejo que esta pantalla.
    if (typeof run[fn] !== 'function') return mal(new Error('Versiones distintas: el servidor (crm_mora.gs) no tiene "' + fn + '". Pegá los últimos crm_mora.gs y crm_index.html y publicá una Nueva versión.'));
    run[fn].apply(null, args);
  });
}
// Con sesión: agrega el token; si la sesión venció, vuelve al ingreso.
function api(fn) {
  var args = [fn, S.token].concat(Array.prototype.slice.call(arguments, 1));
  return apiLibre.apply(null, args).catch(function (e) {
    var msg = String(e && e.message || e);
    if (msg.indexOf('SESION:') >= 0) {
      var limpio = msg.replace(/^.*SESION:\s*/, '');
      if (limpio.indexOf('cambiar la clave') >= 0) pantallaClave(true); else pantallaLogin(limpio);
      var err = new Error(limpio); err.sesion = true; throw err;
    }
    throw e;
  });
}
function guardarToken(t) {
  S.token = t;
  try { if (t) localStorage.setItem('crmToken', t); else localStorage.removeItem('crmToken'); } catch (e) {}
}

// ---------- Acceso ----------
function mostrarAuth(html) {
  $('app').hidden = true; $('ficha').hidden = true; $('auth').hidden = false;
  $('auth').innerHTML = '<div class="auth"><div class="marca"><div class="logo"><b>M</b><span>CRM Mora</span></div>' +
    '<div><h2>Cada contacto cuenta.</h2><p>Gestión de mora de planes de ahorro: trabajá tu cartera al día, priorizando lo que Fiat mide el mes próximo.</p></div>' +
    '<div class="muted" style="color:#6c7a99">Acceso exclusivo @grupoantun.com.ar</div></div><div class="form">' + html + '</div></div>';
}
function pantallaLogin(msg) {
  guardarToken(null);
  mostrarAuth('<form id="fLogin"><h3>Ingresar</h3><div class="muted">Con tu mail de la empresa y tu clave del CRM.</div>' +
    '<label class="fl">Mail<input class="in" name="email" type="email" autocomplete="username" placeholder="nombre@grupoantun.com.ar" required></label>' +
    '<label class="fl">Clave<input class="in" name="clave" type="password" autocomplete="current-password" required></label>' +
    '<button class="btn pri" type="submit">Ingresar</button><div class="err">' + esc(msg || '') + '</div></form>');
  var f = $('fLogin'); f.email.focus();
  f.onsubmit = function (e) {
    e.preventDefault();
    var b = f.querySelector('button'); b.disabled = true; b.innerHTML = '<span class="cargando"></span>Ingresando…';
    apiLibre('crmLogin', f.email.value, f.clave.value).then(function (r) {
      guardarToken(r.token);
      if (r.debeCambiarClave) pantallaClave(true); else iniciar();
    }).catch(function (x) { b.disabled = false; b.textContent = 'Ingresar'; f.querySelector('.err').textContent = x.message || x; });
  };
}
function pantallaClave(obligatorio) {
  mostrarAuth('<form id="fClave"><h3>' + (obligatorio ? 'Elegí tu clave' : 'Cambiar clave') + '</h3>' +
    '<div class="muted">' + (obligatorio ? 'Es tu primer ingreso o te blanquearon la clave. ' : '') + 'Mínimo 8 caracteres.</div>' +
    '<label class="fl">Clave actual<input class="in" name="actual" type="password" autocomplete="current-password" required></label>' +
    '<label class="fl">Clave nueva<input class="in" name="nueva" type="password" autocomplete="new-password" minlength="8" required></label>' +
    '<label class="fl">Repetir clave nueva<input class="in" name="repetir" type="password" autocomplete="new-password" minlength="8" required></label>' +
    '<button class="btn pri" type="submit">Guardar clave</button>' +
    '<button class="btn ghost" type="button" id="volver">' + (obligatorio ? 'Salir' : 'Cancelar') + '</button><div class="err"></div></form>');
  var f = $('fClave'); f.actual.focus();
  $('volver').onclick = obligatorio ? salir : iniciar;
  f.onsubmit = function (e) {
    e.preventDefault();
    var err = f.querySelector('.err');
    if (f.nueva.value !== f.repetir.value) { err.textContent = 'Las claves nuevas no coinciden.'; return; }
    var b = f.querySelector('button'); b.disabled = true;
    api('crmCambiarClave', f.actual.value, f.nueva.value).then(function () { toast('Clave actualizada.'); iniciar(); })
      .catch(function (x) { b.disabled = false; err.textContent = x.message || x; });
  };
}
function salir() {
  var t = S.token; pantallaLogin('');
  if (t) apiLibre('crmLogout', t).catch(function () {});
}

// ---------- Arranque ----------
try { S.token = localStorage.getItem('crmToken'); } catch (e) {}
if (S.token) iniciar(); else pantallaLogin('');

function iniciar() {
  $('auth').hidden = true; $('app').hidden = false;
  S.vista = 'cartera';
  $('main').innerHTML = '<div class="vacio"><span class="cargando"></span>Cargando tu cartera…</div>';
  api('crmInicio').then(function (ini) {
    S.ini = ini;
    if (ini.version !== VERSION) toast('⚠️ Versiones distintas: pantalla ' + VERSION + ' / servidor ' + (ini.version || 'anterior') + '. Pegá los últimos archivos y publicá una Nueva versión.');
    $('ver').textContent = 'Versión ' + VERSION;
    $('yoAv').textContent = iniciales(ini.usuario.nombre);
    $('yoNom').textContent = ini.usuario.nombre;
    $('yoRol').textContent = ini.esSupervisor ? 'Supervisor' : 'Responsable';
    armarNav(); encabezado();
    return Promise.all([cargarObjetivos(), cargarCartera()]);
  }).catch(function (e) {
    if (e.sesion) return;
    $('main').innerHTML = '<div class="card vacio alerta">' + esc(e.message || e) + '</div>';
  });
}
$('salir').onclick = salir;
$('buscar').oninput = function (e) {
  S.filtro.texto = e.target.value; S.limite = 200;
  clearTimeout(S._b); S._b = setTimeout(render, 200);
};

function cargarObjetivos() {
  return api('crmListarObjetivos').then(function (o) { S.objetivos = o; armarNav(); }).catch(error);
}
// ¿El plan entra en el objetivo? (responsable, avance y prioridad)
function enObjetivo(p, o) {
  return (o.responsableEmail === '*' || o.responsableEmail === p.responsableEmail) &&
    (!o.avances.length || o.avances.indexOf(p.avance) >= 0) && o.situaciones.indexOf(p.situacion.codigo) >= 0;
}
function gestionadoDesde(p, fecha) { return !!p.ultimaGestion && p.ultimaGestion.slice(0, 10) >= fecha; }
function objetivosVigentes() { return S.objetivos.filter(function (o) { return !o.vencido; }); }
function marcaObjetivo(p) {
  return objetivosVigentes().some(function (o) { return enObjetivo(p, o) && !gestionadoDesde(p, o.desde); });
}
// Avance de un objetivo, opcionalmente para un solo responsable.
function avanceObjetivo(o, email) {
  var casos = S.planes.filter(function (p) { return enObjetivo(p, o) && (!email || p.responsableEmail === email); });
  var hechos = casos.filter(function (p) { return gestionadoDesde(p, o.desde); }).length;
  return { total: casos.length, hechos: hechos, fr: casos.length ? hechos / casos.length : 1 };
}

function cargarCartera() {
  return api('crmListarCartera').then(function (planes) { S.planes = planes; armarNav(); render(); }).catch(error);
}

function armarNav() {
  var sup = S.ini.esSupervisor;
  var agenda = S.planes.filter(function (p) { return esActiva(p) && p.agendaHoy; }).length;
  var items = [['cartera', '▦', sup ? 'Carteras' : 'Mi cartera'], ['agenda', '◷', 'Agenda de hoy', agenda], ['bajas', '⊘', 'Rescindidos / bajas']];
  var h = items.map(itemNav).join('');
  if (sup) h += '<div class="sec">Supervisión</div>' + [['tablero', '▤', 'Tablero'], ['objetivos', '◎', 'Objetivos', S.objetivos.length], ['usuarios', '☺', 'Usuarios']].map(itemNav).join('');
  h += '<div class="sec">Cuenta</div>' + itemNav(['clave', '⚿', 'Cambiar clave']);
  $('nav').innerHTML = h;
  cada('#nav .nav', null, function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-v');
      if (v === 'clave') return pantallaClave(false);
      S.vista = v; S.filtro.situacion = ''; S.filtro.avance = ''; S.filtro.objetivo = ''; S.limite = 200; armarNav(); encabezado(); render();
    };
  });
}
function itemNav(it) {
  return '<button class="nav' + (S.vista === it[0] ? ' on' : '') + '" data-v="' + it[0] + '"><span class="ic">' + it[1] + '</span><span class="tx">' + it[2] + '</span>' +
    (it[3] ? '<span class="n">' + it[3] + '</span>' : '') + '</button>';
}
function encabezado() {
  var d = new Date(), mes = MESES[d.getMonth()];
  var t = {
    cartera: ['Carteras', mes.charAt(0).toUpperCase() + mes.slice(1) + ' ' + d.getFullYear()],
    objetivos: ['Objetivos', 'Qué tiene que trabajar cada responsable y hasta cuándo'],
    agenda: ['Agenda de hoy', 'Re-contactos agendados y promesas de pago vencidas sin pago'],
    bajas: ['Rescindidos y bajas', 'Solo consulta: no entran en la cola de trabajo'],
    tablero: ['Tablero supervisor', 'Avance del equipo y proyección de lo que mide Fiat'],
    usuarios: ['Usuarios', 'Altas, roles, carteras y claves'],
  }[S.vista];
  $('titulo').textContent = t[0]; $('subtitulo').textContent = t[1];
  $('buscar').hidden = S.vista === 'tablero' || S.vista === 'usuarios' || S.vista === 'objetivos';
}

function render() {
  var m = $('main');
  if (S.vista === 'tablero') return renderTablero(m);
  if (S.vista === 'usuarios') return renderUsuarios(m);
  if (S.vista === 'objetivos') return renderObjetivos(m);
  renderLista(m);
}

// ---------- Cartera / agenda / bajas ----------
function base() {
  return S.planes.filter(function (p) {
    if (S.filtro.resp && p.responsableEmail !== S.filtro.resp) return false;
    if (S.vista === 'bajas') return !esActiva(p);
    if (S.vista === 'agenda') return esActiva(p) && p.agendaHoy;
    return esActiva(p);
  });
}
function coincide(p, sit) {
  if (!sit) return true;
  if (sit === 'P34') return p.situacion.codigo === 'P3' || p.situacion.codigo === 'P4';
  return p.situacion.codigo === sit;
}
function filtrados(lista) {
  var f = S.filtro, t = f.texto.toLowerCase();
  return lista.filter(function (p) {
    if (!coincide(p, f.situacion)) return false;
    if (f.avance && p.avance !== Number(f.avance)) return false;
    if (f.objetivo) { var o = S.objetivos.filter(function (x) { return x.id === f.objetivo; })[0]; if (o && !enObjetivo(p, o)) return false; }
    if (f.estado && p.estadoCaso !== f.estado) return false;
    if (t && (p.cliente + ' ' + p.solicitud + ' ' + p.telefono + ' ' + p.grupo).toLowerCase().indexOf(t) < 0) return false;
    return true;
  }).map(function (p) { p._obj = marcaObjetivo(p); return p; }).sort(function (a, b) {
    // Primero lo pendiente de un objetivo del supervisor; después la prioridad;
    // dentro de cada una, primero los que hace más que no se gestionan.
    return (b._obj - a._obj) || a.situacion.orden - b.situacion.orden || (a.ultimaGestion || '').localeCompare(b.ultimaGestion || '') || a.avance - b.avance;
  });
}
function proximaAccion(p) {
  var hoy = hoyStr();
  if (p.promesaFecha && !p.situacion.cuotaMesPaga && esActiva(p)) {
    if (p.promesaFecha < hoy) return '<span class="alerta">Promesa vencida ' + ddmm(p.promesaFecha) + '</span>';
    if (p.promesaFecha === hoy) return '<span class="alerta">Promesa vence hoy</span>';
  }
  if (p.proximoContacto) return p.proximoContacto <= hoy ? '<span class="alerta">Contactar hoy</span>' : 'Re-contactar ' + ddmm(p.proximoContacto);
  if (p.promesaFecha && p.promesaFecha > hoy) return 'Promesa ' + ddmm(p.promesaFecha);
  if (esPrio(p) && !p.ultimaGestion) return '<span class="alerta">Nunca contactado</span>';
  return '<span class="muted">—</span>';
}

function renderLista(m) {
  var sup = S.ini.esSupervisor, lista = base(), vis = filtrados(lista);
  S.cola = vis.map(function (p) { return p.solicitud; });
  var cuenta = function (c) { return lista.filter(function (p) { return coincide(p, c); }).length; };
  var h = '';

  if (S.vista === 'cartera') {
    var prio = lista.filter(esPrio), hechos = prio.filter(function (p) { return p.intentosMes > 0; }).length;
    var sinG = prio.length - hechos, fr = prio.length ? hechos / prio.length : 0;
    var hoy = new Date(), fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate() - hoy.getDate();
    var sinP1 = lista.filter(function (p) { return p.situacion.codigo === 'P1' && !p.intentosMes; }).length;
    var sinP2 = lista.filter(function (p) { return p.situacion.codigo === 'P2' && !p.intentosMes; }).length;
    var nombre = S.ini.usuario.nombre.split(' ').slice(-1)[0]; // "Godoy Santiago" → "Santiago"

    h += '<div class="saludo"><span style="font-size:22px">' + (hoy.getHours() < 13 ? '☀️' : '👋') + '</span><div><b>' + (hoy.getHours() < 13 ? 'Buen día' : 'Hola') + ', ' + esc(nombre) + '</b>' +
      '<div class="muted">' + (sinG ? 'Quedan <b>' + sinG + '</b> casos P1+P2 sin gestión este mes' : '¡Todos los P1+P2 tienen al menos una gestión este mes!') +
      ' · faltan ' + fin + ' días para fin de mes.</div></div>' +
      (S.cola.length && !sup ? '<button class="btn pri" id="empezar" style="margin-left:auto">Empezar por el primero →</button>' : '') + '</div>';
    if (!sup) h += tarjetasObjetivos();
    h += '<div class="kpis">' +
      kpi('P1', 'P1 · Atrasados', cuenta('P1'), sinP1 + ' sin gestión este mes', 'var(--p1)') +
      kpi('P2', 'P2 · Cuota del mes', cuenta('P2'), sinP2 + ' sin gestión este mes', 'var(--p2)') +
      kpi('P34', 'P3 / P4 · Resto de avances', cuenta('P34'), 'atrasados y cuota del mes', 'var(--p3)') +
      kpi('AL_DIA', 'Al día', cuenta('AL_DIA'), 'incluye la cuota del mes', 'var(--ok)') +
      '<div class="kpi" style="border-top-color:var(--accent);cursor:default"><div class="l">Avance del mes (P1+P2)</div><div class="v">' + Math.round(fr * 100) + '%</div>' +
      '<div class="meter"><i style="width:' + (fr * 100) + '%"></i></div></div></div>';
  }

  var tabs = S.vista === 'bajas' ? [['', 'Todos'], ['RESCINDIDO', 'Rescindidos'], ['BAJA', 'Bajas']]
    : [['', 'Todos'], ['P1', 'P1'], ['P2', 'P2'], ['P3', 'P3'], ['P4', 'P4']].concat(S.vista === 'cartera' ? [['AL_DIA', 'Al día']] : []);
  var nSel = Object.keys(S.seleccion).length;

  h += '<div class="card">';
  if (sup && nSel) {
    h += '<div class="selbar"><b>' + nSel + ' seleccionado' + (nSel > 1 ? 's' : '') + '</b><span>Reasignar a</span><select id="reasDest">' +
      S.ini.responsables.map(function (r) { return '<option value="' + esc(r.email) + '">' + esc(r.nombre) + '</option>'; }).join('') +
      '</select><button class="btn sm pri" id="reasBtn">Reasignar</button><button class="btn sm ghost" id="reasNo" style="color:#c8d1e6">Limpiar</button></div>';
  }
  var activos = [];
  if (S.filtro.objetivo) { var ob = S.objetivos.filter(function (x) { return x.id === S.filtro.objetivo; })[0]; activos.push(['objetivo', '◎ ' + (ob ? ob.titulo : 'Objetivo')]); }
  if (S.filtro.avance) activos.push(['avance', 'Avance ' + S.filtro.avance]);
  if (activos.length) h += '<div class="activos">Filtrando: ' + activos.map(function (a) { return '<button class="chip on" data-quitar="' + a[0] + '">' + esc(a[1]) + ' ✕</button>'; }).join('') + '</div>';
  h += '<div class="bar">' + tabs.map(function (t) {
    return '<button class="tab' + (S.filtro.situacion === t[0] ? ' on' : '') + '" data-sit="' + t[0] + '">' + t[1] + ' <small>' + (t[0] ? cuenta(t[0]) : lista.length) + '</small></button>';
  }).join('') + '<button class="btn sm ghost" id="leyenda" title="¿Cómo se ordena?">ⓘ ¿Qué es P1, P2…?</button><div class="der"><select id="fEst">' + opciones(S.ini.listas.estadosCaso, S.filtro.estado, 'Estado del caso: todos') + '</select>' +
    (sup ? '<select id="fResp"><option value="">Todos los responsables</option>' + S.ini.responsables.map(function (r) {
      return '<option value="' + esc(r.email) + '"' + (S.filtro.resp === r.email ? ' selected' : '') + '>' + esc(r.nombre) + '</option>';
    }).join('') + '</select>' : '') + '<button class="btn sm" id="refrescar" title="Volver a leer BASE">↻ Actualizar</button></div></div>';

  h += '<div class="leyenda" id="leyendaTxt" hidden>' + ['P1', 'P2', 'P3', 'P4'].map(function (c) {
    return '<div>' + pillSit({ codigo: c, etiqueta: S.ini.listas.situaciones[c].etiqueta }) + ' ' + esc(S.ini.listas.situaciones[c].detalle) +
      (c === 'P1' ? ' <span class="muted">(avances ' + S.ini.cuotasFiat.join(', ') + ')</span>' : '') + '</div>';
  }).join('') + '<div class="muted">Dentro de cada prioridad aparecen primero los que hace más tiempo que no se contactan. Los marcados con ◎ son parte de un objetivo del supervisor y van arriba de todo.</div></div>';
  if (!vis.length) {
    h += '<div class="vacio">' + (S.vista === 'agenda' ? '🎉 No tenés nada agendado para hoy.' : 'No hay planes para mostrar con estos filtros.') + '</div>';
  } else {
    h += '<div class="tw"><table><thead><tr>' + (sup ? '<th><input type="checkbox" id="selTodos"></th>' : '') +
      '<th>Prioridad</th><th>Cliente</th><th>Avance</th><th>Cuotas C2 → C14</th><th>Estado del caso</th><th>Últ. contacto</th><th>Próxima acción</th>' +
      (sup ? '<th>Responsable</th>' : '') + '</tr></thead><tbody>' +
      vis.slice(0, S.limite).map(function (p) {
        return '<tr data-sol="' + esc(p.solicitud) + '">' +
          (sup ? '<td><input type="checkbox" class="sel" data-sol="' + esc(p.solicitud) + '"' + (S.seleccion[p.solicitud] ? ' checked' : '') + '></td>' : '') +
          '<td class="nowrap">' + pillSit(p.situacion, true) + (p._obj ? ' <span class="obj" title="Parte de un objetivo del supervisor">◎</span>' : '') + '</td>' +
          '<td class="cli"><b>' + esc(p.cliente) + '</b><span>Sol. ' + esc(p.solicitud) + ' · ' + esc(p.grupo) + '/' + esc(p.orden) + '</span></td>' +
          '<td class="nowrap">' + esc(p.avance) + (sup && p.situacion.medidoPorFiat ? '<span class="fiat">FIAT</span>' : '') + '</td>' +

          '<td class="nowrap">' + (p.ultimaGestion ? haceCuanto(p.ultimaGestion) + ' <span class="muted">· ' + esc(p.ultimoCanal) + '</span>' : '<span class="muted">—</span>') + '</td>' +
          '<td class="nowrap">' + proximaAccion(p) + '</td>' +
          (sup ? '<td class="nowrap"><span class="avatar sm" style="background:' + colorDe(p.responsableEmail) + '">' + iniciales(p.responsableNombre) + '</span> ' + esc(p.responsableNombre) + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      (vis.length > S.limite ? '<div class="mas"><button class="btn" id="mas">Mostrar más (' + (vis.length - S.limite) + ' restantes)</button></div>' : '');
  }
  m.innerHTML = h + '</div>';

  cada('.kpi[data-sit], .tab[data-sit]', m, function (b) {
    b.onclick = function () { var c = b.getAttribute('data-sit'); S.filtro.situacion = S.filtro.situacion === c && b.classList.contains('kpi') ? '' : c; S.limite = 200; render(); };
  });
  $('fEst').onchange = function (e) { S.filtro.estado = e.target.value; render(); };
  $('leyenda').onclick = function () { $('leyendaTxt').hidden = !$('leyendaTxt').hidden; };
  cada('[data-quitar]', m, function (b) { b.onclick = function () { S.filtro[b.getAttribute('data-quitar')] = ''; render(); }; });
  cada('[data-trabajar]', m, function (b) {
    b.onclick = function () { S.filtro.objetivo = b.getAttribute('data-trabajar'); S.filtro.situacion = ''; render(); if (S.cola.length) abrirFicha(S.cola[0]); };
  });
  if ($('fResp')) $('fResp').onchange = function (e) { S.filtro.resp = e.target.value; render(); };
  $('refrescar').onclick = function () { toast('Actualizando…'); cargarCartera(); };
  if ($('mas')) $('mas').onclick = function () { S.limite += 300; render(); };
  if ($('empezar')) $('empezar').onclick = function () { abrirFicha(S.cola[0]); };
  cada('tbody tr', m, function (tr) {
    tr.onclick = function (e) { if (e.target.type !== 'checkbox') abrirFicha(tr.getAttribute('data-sol')); };
  });
  if (sup) {
    cada('input.sel', m, function (c) {
      c.onchange = function () { if (c.checked) S.seleccion[c.getAttribute('data-sol')] = 1; else delete S.seleccion[c.getAttribute('data-sol')]; render(); };
    });
    if ($('selTodos')) $('selTodos').onchange = function (e) {
      vis.slice(0, S.limite).forEach(function (p) { if (e.target.checked) S.seleccion[p.solicitud] = 1; else delete S.seleccion[p.solicitud]; });
      render();
    };
    if ($('reasNo')) $('reasNo').onclick = function () { S.seleccion = {}; render(); };
    if ($('reasBtn')) $('reasBtn').onclick = function () {
      var sols = Object.keys(S.seleccion), b = this; b.disabled = true;
      api('crmReasignar', sols, $('reasDest').value).then(function (n) {
        toast('✔ ' + n + ' plan(es) reasignados.'); S.seleccion = {}; return cargarCartera();
      }).catch(function (e) { b.disabled = false; error(e); });
    };
  }
}
function kpi(cod, l, v, h, color) {

// ---------- Ficha del plan ----------
function abrirFicha(sol) {

}

$('ficha').onclick = function (e) { if (e.target.id === 'ficha') cerrarFicha(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('ficha').hidden) cerrarFicha(); });

    '<h2>' + esc(p.cliente) + '</h2><div class="row">' + pillSit(p.situacion) + pillCaso(c.estadoCaso || 'Sin gestionar') + '<span class="pill caso sin">' + esc(p.estado) + '</span></div>' +
    '<div class="muted" style="margin-top:8px">Sol. ' + esc(p.solicitud) + ' · Grupo ' + esc(p.grupo) + ' / Orden ' + esc(p.orden) + ' · Avance ' + esc(p.avance) +

    '<div class="row" style="margin-top:12px">' +
    (tel ? '<a class="btn pri" href="tel:' + tel + '" target="_blank">📞 ' + esc(p.telefono) + '</a><a class="btn wa" href="https://wa.me/549' + tel + '" target="_blank">WhatsApp</a>' : '<span class="muted">Sin teléfono cargado</span>') +
    (tel2 ? '<a class="btn" href="tel:' + tel2 + '" target="_blank">📞 Alt. ' + esc(p.telefonoAlt) + '</a>' : '') + '</div></div>' +
    '<div class="dr-tabs">' + [['gestionar', 'Gestionar'], ['datos', 'Datos del plan'], ['historial', 'Historial (' + (d.gestiones.length + p.notasBase.length) + ')']].map(function (t) {

  ({ gestionar: tabGestionar, datos: tabDatos, historial: tabHistorial })[S.fichaTab](d, $('drb'), i);

function cuotasGrandes(p) {
  return '<div class="cuotas">' + p.cuotas.map(function (v, k) {
    var n = k + 2, mes = n === p.avance;

  var h = '<h4>Cuotas</h4>' + cuotasGrandes(p) +

    }).join('') + '</div>' +
    '<h4>¿Qué pasó?</h4><div class="chips" data-campo="resultado">' + L.resultados.filter(function (x) { return x !== 'N/A'; }).map(function (x) {

    '<label class="fl">Monto prometido<input class="in" type="number" min="0" step="any" name="promesaMonto" placeholder="$" value="' + esc(c.promesaMonto || '') + '"></label></div></div>' +
    '<label class="fl">Próximo contacto<input class="in" type="date" name="proximoContacto" min="' + hoyStr() + '">' +
    '<span class="atajos"><button type="button" class="btn sm" data-d="1">Mañana</button><button type="button" class="btn sm" data-d="3">+3 días</button><button type="button" class="btn sm" data-d="7">+1 semana</button></span></label>' +

  var ult = d.gestiones.slice(0, 3);

  if (S.ini.esSupervisor) h += bloqueReasignar(p);
  el.innerHTML = h;

  var f = $('fG'), datos = { canal: L.canales[0], resultado: '' };
  cada('.chips', f, function (grupo) {

      promesaMonto: f.estadoCaso.value === 'Promesa de pago' ? f.promesaMonto.value : '',

    };
    cada('button[type=submit]', f, function (b) { b.disabled = true; });

  enlazarReasignar(p);
}
// Sugiere un estado del caso según el resultado del contacto (se puede cambiar).

  if (mapa[res] && f.estadoCaso.value !== 'Promesa de pago') { f.estadoCaso.value = mapa[res]; f.estadoCaso.onchange(); }

// ---------- Objetivos ----------
function textoObjetivo(o) {
  var sit = o.situaciones.join(' + '), av = o.avances.length ? 'avance ' + o.avances.join(', ') : 'todos los avances';

function diasHasta(f) { return -diasDesde(f); }

  return '<div class="objs">' + mios.map(function (o) {

      '<div class="meter' + (ok ? ' ok' : '') + '"><i style="width:' + Math.round(a.fr * 100) + '%"></i></div>' +
      '<div class="pie"><span><b>' + a.hechos + ' de ' + a.total + '</b> gestionados · meta ' + o.meta + '% · ' +

// ---------- Tablero: situación por avance ----------
// Mismo criterio que la hoja "Tablero Medición FIAT": un plan en avance N está en
// mora si tiene alguna 'I' en C2..C(N-1) (y no está rescindido); al día es el resto.
// Trabajo = casos atrasados o con la cuota del mes que tuvieron al menos una gestión este mes.
function enMora(p) {
  if (p.situacion.codigo === 'RESCINDIDO') return false;
  return (p.cuotas || []).slice(0, Math.max(0, p.avance - 2)).indexOf('I') >= 0;
}
function numerosAvance(lista) {
  var total = lista.length, res = lista.filter(function (p) { return p.situacion.codigo === 'RESCINDIDO'; }).length;
  var mora = lista.filter(enMora).length;
  var aTrabajar = lista.filter(function (p) { return ['P1', 'P2', 'P3', 'P4'].indexOf(p.situacion.codigo) >= 0; });
  var hechos = aTrabajar.filter(function (p) { return p.intentosMes > 0; }).length;
  return { total: total, res: res, mora: mora, ok: total - res - mora, pct: total ? (res + mora) / total : 0,
    aTrabajar: aTrabajar.length, hechos: hechos, trabajo: aTrabajar.length ? hechos / aTrabajar.length : 0 };
}
// Tramo logrado y planes a regularizar para llegar a cada tramo (A: mora menor a; B: hasta).
function calcTramo(x, t) {
  var malos = x.res + x.mora, e = 1e-9;
  var faltaA = Math.max(0, Math.floor(malos - t.a * x.total + e) + 1);
  var faltaB = Math.max(0, Math.ceil(malos - t.b * x.total - e));
  if (x.pct < t.a - e) faltaA = 0;
  return { logrado: x.pct < t.a - e ? 'A' : x.pct <= t.b + e ? 'B' : '', faltaA: faltaA, faltaB: faltaB };
}
// Reparte "total" planes a levantar entre responsables en proporción a su cartera
// (resto mayor, así la suma da exacto), sin pasarse de los planes en mora de cada
// uno: lo que no pueden levantar se redistribuye entre los demás.
function repartir(total, grupos) {
  var asign = grupos.map(function () { return 0; }), queda = total;
  for (var vuelta = 0; vuelta < 10 && queda > 0; vuelta++) {
    var abiertos = grupos.map(function (g, k) { return k; }).filter(function (k) { return asign[k] < grupos[k].tope; });
    var peso = abiertos.reduce(function (a, k) { return a + grupos[k].cartera; }, 0);
    if (!abiertos.length || !peso) break;
    var partes = abiertos.map(function (k) { var ideal = queda * grupos[k].cartera / peso; return { k: k, base: Math.floor(ideal), resto: ideal - Math.floor(ideal) }; });
    var usados = partes.reduce(function (a, x) { return a + x.base; }, 0);
    partes.sort(function (a, b) { return b.resto - a.resto; }).forEach(function (x, i) { if (i < queda - usados) x.base++; });
    partes.forEach(function (x) {
      var dar = Math.min(x.base, grupos[x.k].tope - asign[x.k]);
      asign[x.k] += dar; queda -= dar;
    });
  }
  return asign;
}
function barraTrabajo(x) {
  if (!x.aTrabajar) return '<span class="muted">—</span>';
  var c = x.trabajo >= 0.8 ? 'var(--ok)' : x.trabajo >= 0.4 ? 'var(--accent)' : 'var(--p2)';
  return '<div class="pr"><div class="t"><i style="width:' + x.trabajo * 100 + '%;background:' + c + '"></i></div><b>' + Math.round(x.trabajo * 100) + '%</b> <span class="muted">' + x.hechos + '/' + x.aTrabajar + '</span></div>';
}
function dibujarAvances() {
  var el = $('avSec');
  if (!el) return;
  S.tabAv = S.tabAv || 'medidos'; S.abiertos = S.abiertos || {};
  var medidos = S.ini.cuotasFiat, tramos = S.tramos || {};
  var todos = S.planes.map(function (p) { return p.avance; }).filter(function (v, k, a) { return a.indexOf(v) === k; }).sort(function (a, b) { return a - b; });
  var avances = S.tabAv === 'medidos' ? medidos : todos;
  var abierto = function (a) { return S.abiertos[a] !== undefined ? S.abiertos[a] : false; };

  // tramo: el de la cuota (solo avances medidos y solo en la fila del avance); color del % según el tramo.
  var celdas = function (x, t, conTramo) {
    var tr = t ? calcTramo(x, t) : null;
    var color = tr ? (tr.logrado === 'A' ? 'var(--ok-ink)' : tr.logrado === 'B' ? 'var(--p2-ink)' : 'var(--p1-ink)') : '';
    var h = '<td>' + x.total + '</td><td>' + x.ok + '</td><td class="' + (x.mora ? 'alerta' : '') + '">' + x.mora + '</td><td>' + x.res + '</td>' +
      '<td><b style="color:' + color + '">' + pct(x.pct) + '</b></td>';
    if (conTramo && conTramo.asignado) {
      h += '<td></td><td></td><td></td><td><b class="asig" title="Planes en mora que le toca levantar para llegar al tramo A (según el peso de su cartera en el avance)">' + conTramo.a + '</b></td>' +
        '<td><b class="asig" title="Planes en mora que le toca levantar para llegar al tramo B">' + conTramo.b + '</b></td>';
    } else if (conTramo && tr) {
      h += '<td>' + pct(t.a) + '</td><td>' + pct(t.b) + '</td><td>' +
        (tr.logrado ? '<span class="pill s-AL_DIA">Tramo ' + tr.logrado + '</span>' : '<span class="pill s-P1">Sin cobro</span>') + '</td>' +
        '<td>' + tr.faltaA + '</td><td>' + tr.faltaB + '</td>';
    } else {
      h += '<td></td><td></td><td></td><td></td><td></td>';
    }
    return h + '<td>' + barraTrabajo(x) + '</td>';
  };
  // Avance de los objetivos vigentes que incluyen ese avance, para un responsable.
  var objetivosDe = function (lista, email) {
    return objetivosVigentes().map(function (o) {

      if (!casos.length) return '';

    }).join(' ');
  };
  var sub = function (lista, avance, t) {
    var filas = S.ini.responsables.map(function (r) {
      return { r: r, lista: lista.filter(function (p) { return p.responsableEmail === r.email; }) };
    }).filter(function (f) { return f.lista.length; });
    var sinResp = lista.filter(function (p) { return !p.responsableEmail; });
    if (sinResp.length) filas.push({ r: null, lista: sinResp });
    filas.forEach(function (f) { f.x = numerosAvance(f.lista); });
    // En avances medidos: cuántos planes le toca levantar a cada uno para cada tramo.
    if (t) {

      var grupos = filas.map(function (f) { return { cartera: f.x.total, tope: f.x.mora }; });
      var aA = repartir(tr.faltaA, grupos), aB = repartir(tr.faltaB, grupos);
      filas.forEach(function (f, k) { f.asig = { asignado: true, a: aA[k], b: aB[k] }; });

      return '<tr class="sub" data-av="' + avance + '" data-resp="' + (f.r ? esc(f.r.email) : '') + '"><td class="nowrap">' +

        celdas(f.x, t, f.asig || false) + '<td class="nowrap">' + (f.r ? objetivosDe(f.lista, f.r.email) : '') + '</td></tr>';
    }).join('');
  };

  var h = '<div class="card-h" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3>Situación por avance</h3>' +
    '<div class="d">Planes que hoy están en cada avance. En mora = alguna cuota vencida impaga (C2 a C(N-1)). % mora = (en mora + rescindidos) / cartera. ' +
    'Tramos, tramo logrado y planes que faltan regularizar solo para los avances que se miden; en cada responsable, los planes que le toca levantar según el peso de su cartera en ese avance. Trabajo = casos atrasados o con la cuota del mes que tuvieron al menos una gestión este mes. ' +
    'Tocá un avance para abrirlo por responsable y un responsable para ver sus casos.</div></div>' +

  avances.forEach(function (a) {

    h += '<tr class="grupo" data-av="' + a + '"><td class="nowrap">' + (abierto(a) ? '▾' : '▸') + ' Avance ' + a +

  el.innerHTML = h + '</tbody></table></div>';

  cada('[data-tabav]', el, function (b) { b.onclick = function () { S.tabAv = b.getAttribute('data-tabav'); S.abiertos = {}; dibujarAvances(); }; });
  $('abrirTodo').onclick = function () {

    };
  });
}

    '"Alias BASE" es cómo figura el responsable en la columna RESPONSABLE de BASE (EZE, FABIO, SANTI): así recibe su cartera. A los supervisores no se les asignan planes.</div></div>' +
    '<div class="tw" style="padding:10px 4px"><table><thead><tr><th>Email</th><th>Nombre</th><th>Rol</th><th>Alias BASE</th><th>Activo</th><th>Clave</th><th></th></tr></thead><tbody>' +
    us.map(function (u) { return fila(u, false); }).join('') + fila({ email: '', nombre: '', rol: 'RESPONSABLE', alias: '', activo: true }, true) + '</tbody></table></div></div>';
  cada('button.blanquear', m, function (b) {
    b.onclick = function () {
      var email = b.closest('tr').getAttribute('data-email');
      if (b.getAttribute('data-ok') !== '1') { b.setAttribute('data-ok', '1'); b.textContent = '¿Confirmar?'; b.classList.add('pri'); return; }
      b.disabled = true;
      api('crmBlanquearClave', email).then(function (lista) { toast('✔ Clave de ' + email + ' blanqueada'); dibujarUsuarios(m, lista); })
        .catch(function (e) { b.disabled = false; error(e); });
    };
  });
  cada('button.guardar', m, function (b) {
    b.onclick = function () {
      var tr = b.closest('tr'), q = function (n) { return tr.querySelector('[name="' + n + '"]'); };
      var datos = { email: q('email') ? q('email').value : tr.getAttribute('data-email'), nombre: q('nombre').value, rol: q('rol').value, alias: q('alias').value, activo: q('activo').checked };
      b.disabled = true;
      api('crmGuardarUsuario', datos).then(function (lista) {
        toast('✔ Usuario guardado'); dibujarUsuarios(m, lista);
        return api('crmInicio').then(function (ini) { S.ini.responsables = ini.responsables; });
      }).catch(function (e) { b.disabled = false; error(e); });
    };
  });
}
</script>
</body>
</html>
